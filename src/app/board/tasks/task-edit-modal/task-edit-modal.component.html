<div *ngIf="isOpen" class="modal-overlay">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ getModalTitle() }}</h2>
      <button class="btn-close" (click)="cancel()">×</button>
    </div>

    <div class="modal-body">
      <!-- タスクタイトル（必修） -->
      <div class="form-group">
        <label>
          タイトル
          <span class="required">*</span>
          <small class="char-count">({{ editingTask.title?.length || 0 }}/100)</small>
        </label>
        <input type="text" [(ngModel)]="editingTask.title" maxlength="100" class="form-control"
          [class.error]="titleError && !editingTask.title" placeholder="課題の名前を入力..." />
        <span *ngIf="titleError && !editingTask.title" class="error-message">{{ titleError }}</span>
      </div>

      <!-- 説明 -->
      <div class="form-group">
        <label>
          説明
          <small class="char-count">({{ editingTask.description?.length || 0 }}/1000)</small>
        </label>
        <textarea [(ngModel)]="editingTask.description" maxlength="1000" class="form-control" rows="3"></textarea>
      </div>

      <!-- ステータス -->
      <div class="form-group">
        <label>ステータス</label>
        <select [(ngModel)]="editingTask.status" class="form-control">
          <option *ngFor="let col of columns" [value]="col">{{ col }}</option>
        </select>
      </div>

      <!-- 優先度 -->
      <div class="form-group">
        <label>優先度</label>
        <div class="priority-buttons">
          <button [class.active]="editingTask.priority === undefined" (click)="editingTask.priority = undefined"
            class="btn-priority btn-priority-none">
            なし
          </button>
          <button *ngFor="let p of priorities" [class.active]="editingTask.priority === p"
            (click)="editingTask.priority = p" [class]="'btn-priority btn-priority-' + p">
            {{ getPriorityLabel(p) }}
          </button>
        </div>
      </div>

      <!-- 期間（開始日・期限：UI完全揃え） -->
      <div class="form-group">
        <div class="label-row">
          <label>期間（開始日 〜 期限）</label>
        </div>

        <!-- 開始日行 -->
        <div class="date-time-row">
          <span class="field-label">開始日:</span>
          <div class="input-box flex-fill">
            <input type="date" [ngModel]="getStartDateString(editingTask.startDate)"
              (ngModelChange)="onStartDateChange($event)" class="form-control date-input" />
          </div>
          <div class="clear-btn-slot"></div>
        </div>

        <!-- 期限行 -->
        <div class="date-time-row">
          <span class="field-label">期限:</span>
          <div class="input-box flex-2">
            <input type="date" [ngModel]="getDateString(editingTask.dueDate)" (ngModelChange)="onDateChange($event)"
              class="form-control date-input" />
          </div>
          <div class="input-box flex-1">
            <input type="time" [ngModel]="getTimeString(editingTask.dueDate)" (ngModelChange)="onTimeChange($event)"
              class="form-control time-input" [disabled]="!editingTask.dueDate" />
          </div>
          <div class="clear-btn-slot">
            <button type="button" class="btn-clear-time" (click)="clearTimeOnly()" title="時間指定を解除"
              [style.visibility]="getTimeString(editingTask.dueDate) ? 'visible' : 'hidden'">✕</button>
          </div>
        </div>
      </div>

      <!-- ===== 追加: 工数入力 ===== -->
      <div class="form-group">
        <div class="label-row">
          <label>工数 (時間 / 最大999h)</label>
        </div>
        <div class="hours-row">
          <!-- 予定工数 -->
          <div class="hours-col">
            <div class="input-box flex-fill">
              <input type="number" [(ngModel)]="editingTask.estimatedHours" (ngModelChange)="validateHours('estimatedHours')" min="0" max="999" step="0.5" class="form-control" placeholder="予定 (h)" />
            </div>
            <div class="clear-btn-slot">
              <button type="button" class="btn-clear-time" (click)="clearEstimatedHours()" title="予定工数を解除"
                      [style.visibility]="editingTask.estimatedHours != null ? 'visible' : 'hidden'">✕</button>
            </div>
          </div>

          <!-- 実績工数 -->
          <div class="hours-col">
            <div class="input-box flex-fill">
              <input type="number" [(ngModel)]="editingTask.actualHours" (ngModelChange)="validateHours('actualHours')" min="0" max="999" step="0.5" class="form-control" placeholder="実績 (h)" />
            </div>
            <div class="clear-btn-slot">
              <button type="button" class="btn-clear-time" (click)="clearActualHours()" title="実績工数を解除"
                      [style.visibility]="editingTask.actualHours != null ? 'visible' : 'hidden'">✕</button>
            </div>
          </div>
        </div>
      </div>
      <!-- ========================== -->

      <!-- 担当者 -->
      <div class="form-group">
        <label><strong>担当者</strong></label>
        <div class="assignees-list">
          <button *ngFor="let member of boardMembers" [class.selected]="isAssigned(member)"
            (click)="toggleAssignee(member)" class="btn-assignee">
            {{ member }}
          </button>
        </div>
        <div *ngIf="editingTask.assignees && editingTask.assignees.length > 0" class="selected-assignees">
          <div *ngFor="let assignee of editingTask.assignees" class="assignee-tag">
            {{ assignee }}
            <button class="btn-remove-assignee" (click)="toggleAssignee(assignee)">×</button>
          </div>
        </div>
      </div>

      <!-- タグ（最大5つ） -->
      <div class="form-group">
        <label>
          <strong>タグ</strong>
          <small class="hint-text">（最大5つまで）</small>
        </label>

        <!-- タグ入力エリア -->
        <div class="add-tag">
          <input type="text" [(ngModel)]="newTagInput" maxlength="15" placeholder="タグを追加 (最大15文字)..."
            [disabled]="(editingTask.tags?.length || 0) >= 5" (keyup.enter)="addTag()" />
          <button type="button" class="btn-small" (click)="addTag()" [disabled]="(editingTask.tags?.length || 0) >= 5">
            追加
          </button>
        </div>

        <!-- 登録済みタグ一覧 -->
        <div *ngIf="editingTask.tags && editingTask.tags.length > 0" class="selected-tags">
          <span *ngFor="let tag of editingTask.tags; let i = index" class="tag-badge-edit">
            #{{ tag }}
            <button type="button" class="btn-remove-tag" (click)="removeTag(i)">×</button>
          </span>
        </div>
      </div>

      <!-- サブタスク -->
      <div class="form-group">
        <label>
          <strong>サブタスク</strong>
          <button class="btn-small" (click)="addSubtask()">+ 追加</button>
        </label>
        <div *ngIf="editingTask.subtasks && editingTask.subtasks.length > 0" class="subtasks-list">
          <div *ngFor="let subtask of editingTask.subtasks; let i = index" class="subtask-item">
            <input type="checkbox" [(ngModel)]="subtask.completed" />
            <input type="text" [(ngModel)]="subtask.title" maxlength="50" placeholder="サブタスク名 (最大50文字)..." />
            <button class="btn-remove" (click)="removeSubtask(i)">削除</button>
          </div>
        </div>
      </div>

      <!-- コメント -->
      <div class="form-group">
        <label><strong>コメント</strong></label>
        <div class="comments-section">
          <div *ngIf="editingTask.comments && editingTask.comments.length > 0" class="comments-list">
            <div *ngFor="let comment of editingTask.comments; let i = index" class="comment-item">

              <!-- ヘッダー（投稿者・日付・操作ボタン） -->
              <div class="comment-header">
                <strong class="comment-author">{{ comment.author || 'Anonymous' }}</strong>
                <div class="comment-header-right">

                  <!-- 自分のコメントかつ非編集時のみ表示 -->
                  <div *ngIf="comment.author === currentUserName && editingCommentIndex !== i" class="comment-actions">
                    <button class="btn-icon-small" (click)="startEditComment(i, comment.text)" title="編集">✏️</button>
                    <button class="btn-icon-small btn-remove" (click)="removeComment(i)" title="削除">×</button>
                  </div>
                  <small class="comment-date">{{ comment.createdAt | date:'yyyy/MM/dd HH:mm' }}</small>
                </div>
              </div>

              <!-- 通常表示（非編集時） -->
              <div *ngIf="editingCommentIndex !== i" class="comment-text">{{ comment.text }}</div>

              <!-- 編集モード（editingCommentIndex === i の時） -->
              <div *ngIf="editingCommentIndex === i" class="comment-edit-box">
                <textarea [(ngModel)]="editingCommentText" class="comment-edit-textarea"></textarea>
                <div class="comment-edit-actions">
                  <button class="btn-small btn-primary" (click)="saveCommentEdit(i)">保存</button>
                  <button class="btn-small btn-secondary" (click)="cancelCommentEdit()">キャンセル</button>
                </div>
              </div>

            </div>
          </div>

          <!-- 新規コメント入力フォーム -->
          <div class="add-comment">
            <textarea #commentInput maxlength="500" placeholder="コメントを追加 (最大500文字)..."></textarea>
            <button class="btn-small" (click)="addComment(commentInput.value); commentInput.value = ''">追加</button>
          </div>
        </div>
      </div>

      <!-- アクティビティ履歴 (タイムライン表示) -->
      <div class="form-group activity-section" *ngIf="!isNewTask()">
        <label>
          <strong>アクティビティ履歴</strong>
          <small class="hint-text">（操作ログ）</small>
        </label>

        <div class="activity-list" *ngIf="editingTask.activities && editingTask.activities.length > 0">
          <div *ngFor="let act of editingTask.activities" class="activity-item">
            <div class="activity-icon">🕒</div>
            <div class="activity-content">
              <div class="activity-header">
                <strong class="activity-user">{{ act.user }}</strong>
                <span class="activity-action">{{ act.action }}</span>
              </div>
              <small class="activity-time">{{ act.timestamp | date:'yyyy/MM/dd HH:mm' }}</small>
            </div>
          </div>
        </div>

        <div *ngIf="!editingTask.activities || editingTask.activities.length === 0" class="empty-activity">
          まだ履歴はありません
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button *ngIf="!isNewTask()" type="button" class="btn-wiki-export" (click)="exportToWiki()"
        [disabled]="isExportingWiki" title="この課題の内容とコメントをWikiにナレッジとして保存します">
        {{ isExportingWiki ? '転記中...' : '💡 Wikiにナレッジ保存' }}
      </button>
      <button class="btn-cancel" (click)="cancel()">キャンセル</button>
      <button class="btn-save" (click)="saveEdit()">保存</button>
    </div>
  </div>
</div>
