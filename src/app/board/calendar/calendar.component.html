<div class="calendar-wrapper">
  <!-- メインカレンダー領域 -->
  <div class="calendar-container">
    <!-- ヘッダーエリア -->
    <div class="calendar-header">
      <div class="header-left">
        <button class="btn-nav" (click)="prevMonth()">
          <span class="arrow">◀</span> 先月
        </button>
        <!--
        <div class="view-toggle-group">
          <button class="toggle-btn" [class.active]="viewMode === 'month'" (click)="setViewMode('month')">
            📅 カレンダー
          </button>

          <button class="toggle-btn" [class.active]="viewMode === 'gantt'" (click)="setViewMode('gantt')">
            📊 ガント
          </button>
        </div>
        -->
      </div>

      <!-- 年月表示 & 年月選択ピッカー -->
      <div class="month-selector-container">
        <div class="month-center-wrapper">
          <h2 class="current-month clickable" (click)="toggleDatePicker()">
            {{ displayYearMonth }}
          </h2>
          <button class="btn-today" (click)="goToToday()">今月</button>

          <!-- ドロップダウンピッカー -->
          <div class="month-picker-dropdown" *ngIf="showDatePicker">
            <div class="picker-row">
              <select [(ngModel)]="selectedYear" class="picker-select">
                <option *ngFor="let y of yearOptions" [value]="y">{{ y }}年</option>
              </select>
              <select [(ngModel)]="selectedMonth" class="picker-select">
                <option *ngFor="let m of monthOptions" [value]="m">{{ m + 1 }}月</option>
              </select>
            </div>
            <div class="picker-actions">
              <button class="btn-cancel-small" (click)="toggleDatePicker()">キャンセル</button>
              <button class="btn-save-small" (click)="applyDatePicker()">移動</button>
            </div>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button class="btn-unscheduled-toggle" [class.active]="showUnscheduledPanel" (click)="toggleUnscheduledPanel()"
          title="期限未設定のタスクを表示/非表示">
          📌 期限未設定 ({{ unscheduledTasks.length }})
        </button>

        <button class="btn-nav" (click)="nextMonth()">次月
          <span class="arrow">▶</span>
        </button>
      </div>
    </div>

    <!-- 1. 📅 月間カレンダー表示（既存グリッド） -->
    <div *ngIf="viewMode === 'month'" class="calendar-grid">
      <div class="weekday-header" *ngFor="let day of weekDays" [class.holiday]="day==='Sat' || day==='Sun'">
        {{ day }}
      </div>

      <div class="day-cell" *ngFor="let day of calendarDays" [class.other-month]="!day.isCurrentMonth"
        [class.today]="isToday(day.date)" (dragover)="onDragOver($event)" (drop)="onDropToDate($event, day.date)">

        <div class="date-number" [class.text-holiday]="day.isHoliday">
          {{ day.date.getDate() }}
        </div>

        <div class="task-list">
          <div class="calendar-task" *ngFor="let task of day.tasks" [style.backgroundColor]="getTaskColor(task)"
            (click)="openTaskEdit(task)" title="{{ task.title }}">
            {{ task.title }}
          </div>
        </div>
      </div>
    </div>

    <!--
    <div *ngIf="viewMode === 'gantt'" class="gantt-wrapper">
      <div class="gantt-container">
        <div class="gantt-header-row">
          <div class="gantt-left-header">タスク情報</div>
          <div class="gantt-timeline-header">
            <div *ngFor="let day of ganttDays" class="gantt-day-col" [class.is-holiday]="day.isHoliday"
              [class.is-today]="day.isToday">
              <span class="day-num" [class.text-holiday]="day.isHoliday">{{ day.dayNumber }}</span>
              <span class="day-week" [class.text-holiday]="day.isHoliday">{{ day.dayOfWeekStr }}</span>
            </div>
          </div>
        </div>

        <div class="gantt-body">
          <div class="gantt-grid-background">
            <div class="gantt-left-col-placeholder">
              <span class="step-hint">💡 タスク一覧と横バーがここに描画されます</span>
            </div>
            <div class="gantt-timeline-grid">
              <div *ngFor="let day of ganttDays" class="gantt-grid-col" 
                [class.is-holiday]="day.isHoliday" [class.is-today]="day.isToday">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    -->
  </div>

  <!-- 3. 期限未設定サイドパネル（カレンダー表示時のみ右側に並べる） -->
  <div class="unscheduled-panel" *ngIf="showUnscheduledPanel && viewMode === 'month'">
    <div class="panel-header">
      <h3>📌 期限未設定 ({{ unscheduledTasks.length }})</h3>
      <button class="btn-close-panel" (click)="toggleUnscheduledPanel()" title="閉じる">×</button>
    </div>
    <p class="panel-hint">日付マスへドラッグして期限を設定</p>

    <div class="unscheduled-list">
      <div *ngFor="let col of columns" class="column-group">
        <div class="column-group-title">
          <span>{{ col }}</span>
          <span class="group-count">({{ getUnscheduledTasksByColumn(col).length }})</span>
        </div>

        <div class="column-group-tasks">
          <div *ngFor="let task of getUnscheduledTasksByColumn(col)" class="unscheduled-task-card" draggable="true"
            [style.backgroundColor]="getTaskColor(task)" (dragstart)="onUnscheduledDragStart($event, task)"
            (dragend)="onUnscheduledDragEnd()" (click)="onTaskCardClick(task)">
            <span class="task-title">{{ task.title }}</span>
          </div>

          <div *ngIf="getUnscheduledTasksByColumn(col).length === 0" class="empty-column-msg">
            なし
          </div>
        </div>
      </div>

      <div *ngIf="unscheduledTasks.length === 0" class="empty-msg">
        すべてのタスクに期限が設定されています
      </div>
    </div>
  </div>
</div>

<!-- 4. タスク編集モーダル -->
<app-task-edit-modal *ngIf="isModalOpen" [isOpen]="isModalOpen" [task]="selectedTask" [columns]="columns"
  [boardMembers]="boardMembers" [currentUserName]="currentUserName" (save)="saveTask($event)" (close)="closeTaskEdit()">
</app-task-edit-modal>
